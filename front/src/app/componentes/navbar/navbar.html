<header>
  <nav class="barra">
    <app-logo />

    <div class="links">
      <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
      <a routerLink="/publicar" routerLinkActive="activo">Publicar</a>
      <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>
      <!-- Sprint 4: solo los administradores ven el link al dashboard -->
      @if (auth.esAdmin()) {
        <a routerLink="/dashboard" routerLinkActive="activo">Dashboard</a>
      }
    </div>

    <div class="sesion">
      @if (auth.usuario(); as usuario) {
        <a class="usuario" routerLink="/mi-perfil">
          @if (usuario.fotoPerfil) {
            <img
              class="avatar"
              [src]="usuario.fotoPerfil"
              alt="Foto de perfil"
              width="38"
              height="38"
            />
          } @else {
            <span class="avatar">{{ iniciales() }}</span>
          }
          <span class="arroba">&#64;{{ usuario.nombreUsuario }}</span>
        </a>
        <button class="boton translucido" type="button" (click)="salir()">Salir</button>
      } @else {
        <a class="boton translucido" routerLink="/login">Ingresar</a>
        <a class="boton crear" routerLink="/registro">Crear cuenta</a>
      }
    </div>
  </nav>
</header>
